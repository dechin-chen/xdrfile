[build-system]
requires = ["setuptools>=64", "cython>=3.0", "numpy>=2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xdrfile-python"
version = "0.1.0"
description = "Cython binding for libxdrfile: read/write GROMACS XTC into numpy arrays"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "BSD-3-Clause" }
authors = [
    { name = "Dechin CHEN" },
]

[tool.setuptools]
packages = []